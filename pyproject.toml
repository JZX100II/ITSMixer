[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itsmixer"
version = "0.1.0"
description = "Official code for ITSMixer (Iterative Time-Mixing MLPs)"
readme = "README.md"
license = {text = "MIT"}
license-files = {paths = ["LICENSE"]}
authors = [
    {name = "Arian Lotfi and Siavash Damari", email = "arianlotfi83@gmail.com"},
]
requires-python = ">=3.8"
dependencies = [
    "torch>=1.9.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
]
keywords = ["time series", "forecasting", "mlp", "machine learning", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/JZX100II/ITSMixer"
"Documentation" = "https://github.com/JZX100II/ITSMixer#readme"
"Repository" = "https://github.com/JZX100II/ITSMixer.git"
"Issues" = "https://github.com/JZX100II/ITSMixer/issues"
"Paper" = "https://link.springer.com/article/10.1007/s12530-026-09830-0"
